        // 碰撞矩陣 (0=地板, 1=牆壁/設備, 2=門, 3=椅子)
        let COLLISION_MAP = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        let DOORS_OPEN = {};

        class Pathfinder {
            static findPath(startX, startY, endX, endY) {
                if (endX < 0 || endX >= COLS || endY < 0 || endY >= ROWS) return [];
                if (COLLISION_MAP[endY]?.[endX] === 1) return [];

                const startNode = { x: startX, y: startY, g: 0, h: 0, f: 0, parent: null };
                const openList = [startNode];
                const closedList = new Set();

                while (openList.length > 0) {
                    openList.sort((a, b) => a.f - b.f);
                    const current = openList.shift();
                    const pKey = `${current.x},${current.y}`;
                    closedList.add(pKey);

                    if (current.x === endX && current.y === endY) {
                        let curr = current;
                        const path = [];
                        while (curr.parent) {
                            path.push({ x: curr.x, y: curr.y });
                            curr = curr.parent;
                        }
                        return path.reverse();
                    }

                    const neighbors = [
                        { x: 0, y: -1 },
                        { x: 0, y: 1 },
                        { x: -1, y: 0 },
                        { x: 1, y: 0 }
                    ];

                    for (const n of neighbors) {
                        const nx = current.x + n.x;
                        const ny = current.y + n.y;
                        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
                        if (COLLISION_MAP[ny]?.[nx] === 1) continue;
                        if (COLLISION_MAP[ny]?.[nx] === 3 && (nx !== endX || ny !== endY)) continue;

                        const nKey = `${nx},${ny}`;
                        if (closedList.has(nKey)) continue;

                        const cost = DOORS_OPEN[nKey] ? 1 : 10;
                        const g = current.g + cost;
                        const h = Math.abs(nx - endX) + Math.abs(ny - endY);
                        const f = g + h;

                        const existingNode = openList.find(node => node.x === nx && node.y === ny);
                        if (existingNode && g > existingNode.g) continue;
                        if (!existingNode) {
                            openList.push({ x: nx, y: ny, g, h, f, parent: current });
                        }
                    }
                }
                return [];
            }
        }

        class SpriteManager {
            constructor() {
                this.imagesLoaded = false;
                this.sprites = {};
                let loadCount = 0;
                const NUM_CHARS = 6;
                const totalImages = 1 + NUM_CHARS;
                let triedFallbackBackground = false;
                const assetVer = Date.now();

                const onLoad = () => {
                    loadCount++;
                    if (loadCount === totalImages) {
                        this.imagesLoaded = true;
                    }
                };

                this.sprites.background = new Image();
                this.sprites.background.crossOrigin = 'anonymous';
                this.sprites.background.onload = onLoad;
                this.sprites.background.onerror = () => {
                    if (triedFallbackBackground) {
                        onLoad();
                        return;
                    }
                    triedFallbackBackground = true;
                    this.sprites.background.src = `assets/oficina-placeholder.png?v=${assetVer}`;
                };
                this.sprites.background.src = `assets/oficina.png?v=${assetVer}`;

                this.sprites.chars = [];
                for (let i = 0; i < NUM_CHARS; i++) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.src = `assets/characters/char_${i}.png?v=${assetVer}`;
                    img.onload = onLoad;
                    this.sprites.chars.push(img);
                }
            }

            drawCharacter(x, y, action, frame, facing = 'down', characterAttr = null) {
                if (!this.imagesLoaded) return;
                const sWidth = 16;
                const sHeight = 32;
                let rowY = 0;
                let flipX = false;

                if (facing === 'down') rowY = 0;
                else if (facing === 'up') rowY = 1;
                else if (facing === 'right') rowY = 2;
                else if (facing === 'left') {
                    rowY = 2;
                    flipX = true;
                }

                let colX = 0;
                let yOffset = 0;
                if (action === ACTIONS.SITTING) {
                    colX = 3;
                    yOffset = 16;
                } else if (action === ACTIONS.WALKING || action === ACTIONS.OPENING_DOOR) {
                    const walkFrame = Math.floor(frame / 6) % 4;
                    if (walkFrame === 0) colX = 0;
                    else if (walkFrame === 1) colX = 1;
                    else if (walkFrame === 2) colX = 0;
                    else if (walkFrame === 3) colX = 2;
                }

                const sx = colX * sWidth;
                const sy = rowY * sHeight;
                const renderScale = SCALE;

                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = 'rgba(0,0,0,0.28)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 8 * renderScale, 3 * renderScale, 0, 0, Math.PI * 2);
                ctx.fill();

                if (flipX) ctx.scale(-1, 1);

                const charId = (characterAttr && characterAttr.id !== undefined) ? characterAttr.id : 0;
                const charImg = this.sprites.chars[charId % this.sprites.chars.length];
                ctx.drawImage(
                    charImg,
                    sx, sy, sWidth, sHeight,
                    -(sWidth / 2) * renderScale, -sHeight * renderScale + yOffset, sWidth * renderScale, sHeight * renderScale
                );
                ctx.restore();
            }

            drawOfficeTile(x, y, type) {
                if (!this.imagesLoaded) return;
                ctx.save();
                ctx.translate(x, y);
                if (type === 'background') {
                    ctx.drawImage(this.sprites.background, 0, 0);
                }
                ctx.restore();
            }
        }

        class Character {

                this.targetTileY = null;

                this.lastY = y;
                this.stuckTimer = 0;

                this.roomBound = true;
                this.state = 'idle';
                this.defaultRoom = REST_ROOM_NAME;
                this.personality = '勤奮';
                this.restEnteredAt = 0;
                this.sleeping = false;
                this.goingToSleep = false;
            }

            wakeUp() {
                this.goingToSleep = false;
                if (this.sleeping) {
                    this.sleeping = false;
                    this.sitting = false;
                }
            }

            findNearestRestChair(fromX, fromY) {
                const restRoom = (window.roomsInfo || []).find(r => r.name === REST_ROOM_NAME || r.isRestRoom);
                const candidateChairs = [];
                if (restRoom && Array.isArray(restRoom.tiles)) {
                    for (const t of restRoom.tiles) {
                        if (COLLISION_MAP[t.y]?.[t.x] === 3) {
                            candidateChairs.push(t);
                        }
                    }
                }
                if (!candidateChairs.length) {
                    return this.findNearestFreeChair(fromX, fromY);
                }

                let best = null;
                let minDistance = Infinity;
                for (const t of candidateChairs) {
                    const occupied = window.characters.some(c =>
                        c !== this &&
                        (c.action === ACTIONS.SITTING || c.sleeping) &&
                        Math.floor(c.x / GRID_SIZE) === t.x &&
                        Math.floor(c.y / GRID_SIZE) === t.y
                    );
                    const reserved = window.characters.some(c =>
                        c !== this &&
                        c.path && c.path.length > 0 &&
                        c.path[c.path.length - 1].x === t.x &&
                        c.path[c.path.length - 1].y === t.y
                    );
                    if (!occupied && !reserved) {
                        const dist = Math.abs(fromX - t.x) + Math.abs(fromY - t.y);
                        if (dist < minDistance) {
                            minDistance = dist;
                            best = { x: t.x, y: t.y };
                        }
                    }
                }
                return best;
            }

            finalizeSleepOnChair() {
                this.goingToSleep = false;
                this.sleeping = true;
                this.state = 'sleep';
                this.isTalking = false;
                this.bubbleText = '';
                this.bubbleTimer = 0;
                this.path = [];
                this.isWaiting = false;
                this.action = ACTIONS.SITTING;
                this.sitting = true;
                this.faceNearestDesk();
                this.actionTimer = 0;
            }

            enterSleepMode() {
                if (this.sleeping || this.goingToSleep) return;
                const tx = Math.floor(this.x / GRID_SIZE);
                const ty = Math.floor(this.y / GRID_SIZE);
                // 若已經坐在椅子上，直接睡著
                if (COLLISION_MAP[ty]?.[tx] === 3) {
                    this.finalizeSleepOnChair();
                    return;
                }
                // 否則先找休息房內最近的空位椅子走過去，坐下後才睡著
                const chair = this.findNearestRestChair(tx, ty);
                if (chair) {
                    this.isTalking = false;
                    this.bubbleText = '';
                    this.bubbleTimer = 0;
                    this.moveTo(chair.x * GRID_SIZE + GRID_SIZE / 2, chair.y * GRID_SIZE + GRID_SIZE / 2);
                    if (this.path && this.path.length > 0) {
                        this.goingToSleep = true;
                        return;
                    }
                }
                this.finalizeSleepOnChair();
            }

            enterRestLounge() {
                const alreadyInRest = this.defaultRoom === REST_ROOM_NAME
                    && this.roomBound
                    && !this.holdStill
                    && (this.state === 'lounge' || this.state === 'sleep');
                this.defaultRoom = REST_ROOM_NAME;
                this.roomBound = true;
                this.holdStill = false;
                this.isWaiting = false;
                if (!this.restEnteredAt) {
                    this.restEnteredAt = Date.now();
                }
                if (this.sleeping) {
                    this.state = 'sleep';
                    this.action = ACTIONS.SITTING;
                    this.sitting = true;
                    return;
                }
                this.state = 'lounge';
                this.personality = '好動';
                this.sitting = false;
                if (!alreadyInRest && this.action !== ACTIONS.WALKING) {
                    this.action = ACTIONS.IDLE;
                    this.actionTimer = 0;
                    this.nextActionTime = 40 + Math.random() * 80;
                }
            }

            settleAtPost(roomName) {
                const room = roomName || this.defaultRoom;
                if (!room || room === REST_ROOM_NAME) {
                    this.enterRestLounge();
                    return;
                }
                this.wakeUp();
                this.restEnteredAt = 0;
                this.defaultRoom = room;
                this.roomBound = true;
                this.holdStill = false;
                this.isWaiting = false;
                this.state = 'patrol';
                this.settleOnArrive = false;
                this.commandTargetRoom = room;
                if (this.action !== ACTIONS.WALKING) {
                    this.action = ACTIONS.IDLE;
                    this.actionTimer = 0;
                    this.nextActionTime = 40 + Math.random() * 80;
                }
            }

            faceNearestDesk() {
                const tx = Math.floor(this.x / GRID_SIZE);
                const ty = Math.floor(this.y / GRID_SIZE);
                let deskDir = null;
                let minDeskDist = Infinity;
                for (let dy = -2; dy <= 2; dy++) {
                    for (let dx = -2; dx <= 2; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const checkY = ty + dy;
                        const checkX = tx + dx;
                        if (checkY >= 0 && checkY < ROWS && checkX >= 0 && checkX < COLS) {
                            if (COLLISION_MAP[checkY]?.[checkX] === 1) {
                                const dist = Math.abs(dx) + Math.abs(dy);
                                if (dist < minDeskDist || (dist === minDeskDist && dy > 0 && Math.abs(dy) > Math.abs(dx))) {
                                    minDeskDist = dist;
                                    if (Math.abs(dy) >= Math.abs(dx)) {
                                        deskDir = dy < 0 ? 'up' : 'down';
                                    } else {
                                        deskDir = dx < 0 ? 'left' : 'right';
                                    }
                                }
                            }
                        }
                    }
                }
                if (deskDir) this.facing = deskDir;
            }

            isVisitingOtherRoom() {
                const home = AGENT_HOME_ROOM[this.id];
                const cur = this.commandTargetRoom || this.defaultRoom;
                return !!(home && cur && cur !== REST_ROOM_NAME && cur !== home);
            }

            isHoldingAtHandoff() {
                if (this.commandSeated && this.sitting) return true;
                if (this.commandDwellUntil && Date.now() < this.commandDwellUntil) return true;
                if (this.isVisitingOtherRoom() && this.action !== ACTIONS.WALKING) return true;
                return false;
            }

            applyArriveSettle() {
                if (!this.settleOnArrive) {
                    this.isWaiting = false;
                    return;
                }
                this.settleOnArrive = false;
                const room = this.commandTargetRoom || this.defaultRoom;
                const isHandoffVisit = !!(
                    room
                    && room !== REST_ROOM_NAME
                    && ((AGENT_HOME_ROOM[this.id] && room !== AGENT_HOME_ROOM[this.id]) || this.sitAfterOnArrive)
                );
                const dwellMs = ROOM_DWELL_MS[room] || (isHandoffVisit ? 3200 : 1200);
                this.commandDwellUntil = Date.now() + dwellMs;
                if (room === REST_ROOM_NAME) {
                    this.commandSeated = false;
                    this.enterRestLounge();
                } else if (room) {
                    this.settleAtPost(room);
                } else {
                    this.isWaiting = false;
                }
                if (this.sitAfterOnArrive) {
                    this.sitAfterOnArrive = false;
                    this.action = ACTIONS.SITTING;
                    this.sitting = true;
                    this.commandSeated = true;
                    this.actionTimer = 0;
                    this.nextActionTime = 1200;
                    this.faceNearestDesk();
                } else {
                    this.commandSeated = false;
                    this.sitting = false;
                    if (room && room !== REST_ROOM_NAME) {
                        this.faceNearestDesk();
                    }
                }
                try { if (typeof persistAgentsSnapshot === 'function') persistAgentsSnapshot(); } catch (_) {}
            }

            syncRestLoungeState() {
                if (this.isWaiting && this.action === ACTIONS.WALKING) return;
                if (this.roomBound && this.defaultRoom && this.defaultRoom !== REST_ROOM_NAME) {
                    this.restEnteredAt = 0;
                    if (this.sleeping) this.wakeUp();
                    return;
                }
                if (this.defaultRoom === REST_ROOM_NAME) {
                    if (!this.restEnteredAt) this.restEnteredAt = Date.now();
                    if (!this.roomBound || this.holdStill) {
                        this.enterRestLounge();
                    }
                    if (!this.sleeping && !this.goingToSleep && this.action !== ACTIONS.WALKING && (Date.now() - this.restEnteredAt >= REST_SLEEP_AFTER_MS)) {
                        this.enterSleepMode();
                    }
                }
            }

            update() {
                this.frame++;
                this.actionTimer++;
                this.syncRestLoungeState();

                if (this.sleeping) {
                    this.action = ACTIONS.SITTING;
                    this.sitting = true;
                    this.actionTimer = 0;
                    return;
                }

                if (this.isHoldingAtHandoff() && this.action !== ACTIONS.WALKING) {
                    this.actionTimer = 0;
                    if (this.commandSeated) {
                        this.action = ACTIONS.SITTING;
                        this.sitting = true;
                    }
                }

                if (!this.isWaiting && !this.holdStill && !this.isHoldingAtHandoff()) {
                    const allowLongSit = this.sitting;
                    const staticAction = this.action !== ACTIONS.WALKING && (!this.sitting || !allowLongSit);
                    const idleLimit = this.roomBound ? REST_IDLE_FRAMES : MAX_IDLE_FRAMES;
                    if (staticAction && this.actionTimer > idleLimit) {
                        this.moveToRandomPosition();
                        this.action = ACTIONS.WALKING;
                        this.actionTimer = 0;
                        this.nextActionTime = 80 + Math.random() * 120;
                        this.sitting = false;
                    }
                }

                if (this.action === ACTIONS.WALKING && this.path && this.path.length > 0) {
                    const targetTile = this.path[0];
                    const targetPixelX = (targetTile.x * GRID_SIZE) + (GRID_SIZE / 2);
                    const targetPixelY = (targetTile.y * GRID_SIZE) + (GRID_SIZE / 2);

                    let nextDoorTile = null;
                    if (COLLISION_MAP[targetTile.y]?.[targetTile.x] === 2) {
                        nextDoorTile = targetTile;
                    } else if (this.path.length > 1 && COLLISION_MAP[this.path[1].y]?.[this.path[1].x] === 2) {
                        nextDoorTile = this.path[1];
                    }

                    if (nextDoorTile) {
                        const doorKey = `${nextDoorTile.x},${nextDoorTile.y}`;
                        if (!DOORS_OPEN[doorKey]) {
                            const doorsToClose = [];
                            const dirs = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
                            for (const dir of dirs) {
                                const dxx = nextDoorTile.x + dir[0];
                                const dyy = nextDoorTile.y + dir[1];
                                if (dxx >= 0 && dxx < COLS && dyy >= 0 && dyy < ROWS && COLLISION_MAP[dyy]?.[dxx] === 2) {
                                    const dK = `${dxx},${dyy}`;
                                    if (!DOORS_OPEN[dK]) {
                                        DOORS_OPEN[dK] = true;
                                        doorsToClose.push(dK);
                                    }
                                }
                            }
                            if (doorsToClose.length > 0) {
                                setTimeout(() => {
                                    for (const dK of doorsToClose) DOORS_OPEN[dK] = false;
                                }, 3000);
                            }
                        }
                    }

                    const dx = targetPixelX - this.x;
                    const dy = targetPixelY - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < this.speed) {
                        this.x = targetPixelX;
                        this.y = targetPixelY;
                        this.path.shift();

                        if (this.path.length === 0) {
                            if (COLLISION_MAP[targetTile.y]?.[targetTile.x] === 3) {
                                const chairOccupied = window.characters.some(c =>
                                    c !== this &&
                                    c.action === ACTIONS.SITTING &&
                                    Math.floor(c.x / GRID_SIZE) === targetTile.x &&
                                    Math.floor(c.y / GRID_SIZE) === targetTile.y
                                );

                                if (chairOccupied) {
                                    const freeChair = this.goingToSleep
                                        ? this.findNearestRestChair(targetTile.x, targetTile.y)
                                        : this.findNearestFreeChair(targetTile.x, targetTile.y);
                                    if (freeChair) {
                                        const wasGoingToSleep = this.goingToSleep;
                                        this.moveTo(freeChair.x * GRID_SIZE + GRID_SIZE / 2, freeChair.y * GRID_SIZE + GRID_SIZE / 2);
                                        this.goingToSleep = wasGoingToSleep;
                                        return;
                                    }
                                    if (this.goingToSleep) {
                                        this.finalizeSleepOnChair();
                                        return;
                                    }
                                    this.action = ACTIONS.IDLE;
                                    this.sitting = false;
                                    this.actionTimer = 0;
                                    this.nextActionTime = 100 + Math.random() * 200;
                                    this.applyArriveSettle();
                                    return;
                                }

                                if (this.goingToSleep) {
                                    this.finalizeSleepOnChair();
                                    return;
                                }

                                this.action = ACTIONS.SITTING;
                                this.sitting = true;
                                this.actionTimer = 0;
                                this.nextActionTime = 500 + Math.random() * 500;
                                this.applyArriveSettle();
                                this.faceNearestDesk();
                            } else {
                                if (this.goingToSleep) {
                                    this.finalizeSleepOnChair();
                                    return;
                                }
                                this.action = ACTIONS.IDLE;
                                this.actionTimer = 0;
                                this.nextActionTime = 100 + Math.random() * 200;
                                this.sitting = false;
                                this.applyArriveSettle();
                            }
                        }
                    } else {
                        this.x += (dx / distance) * this.speed;
                        this.y += (dy / distance) * this.speed;
                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.facing = dx > 0 ? 'right' : 'left';
                        } else {
                            this.facing = dy > 0 ? 'down' : 'up';
                        }
                    }
                } else if (
                    this.action === ACTIONS.WORKING ||
                    this.action === ACTIONS.READING ||
                    this.action === ACTIONS.DRINKING ||
                    this.action === ACTIONS.PHONE ||
                    this.action === ACTIONS.SITTING
                ) {
                    if (this.actionTimer > this.nextActionTime + 150 && !this.isWaiting) {
                        this.action = ACTIONS.IDLE;
                        this.sitting = false;
                        this.actionTimer = 0;
                        this.nextActionTime = 100 + Math.random() * 200;
                    }
                } else if (this.action === ACTIONS.IDLE && !this.sitting) {
                    if (this.actionTimer > this.nextActionTime && !this.isWaiting && !this.holdStill) {
                        this.chooseRandomAction();
                    }
                }

                // 依角色屬性與所在房間隨機冒出專屬台詞
                if (this.bubbleTimer && this.bubbleTimer > 0) {
                    this.bubbleTimer--;
                    if (this.bubbleTimer <= 0) {
                        this.isTalking = false;
                        this.bubbleText = '';
                    }
                } else if (Math.random() < (this.roomBound ? 0.02 : 0.005) && !this.isTalking) {
                    this.isTalking = true;
                    this.bubbleTimer = 200 + Math.random() * 100;
                    const inRest = (this.defaultRoom === REST_ROOM_NAME || this.state === 'lounge');
                    const profile = ROLE_IDLE_LINES[this.id];
                    const texts = profile ? (inRest ? profile.rest : profile.post) : ['待命中…'];
                    this.bubbleText = texts[Math.floor(Math.random() * texts.length)];
                }

                // 防卡牆保護
                if (!this.isWaiting && !this.holdStill) {
                    if (this.action === ACTIONS.WALKING) {
                        const moved = Math.abs(this.x - this.lastX) + Math.abs(this.y - this.lastY);
                        if (moved < 0.5) {
                            this.stuckTimer++;
                            if (this.stuckTimer > 150) {
                                this.moveToRandomPosition();
                                this.stuckTimer = 0;
                            }
                        } else {
                            this.stuckTimer = 0;
                            this.lastX = this.x;
                            this.lastY = this.y;
                        }
                    } else {
                        this.stuckTimer = 0;
                        this.lastX = this.x;
                        this.lastY = this.y;
                    }
                }
            }

            chooseRandomAction() {
                if (this.holdStill) {
                    this.action = ACTIONS.WORKING;
                    this.actionTimer = 0;
                    this.nextActionTime = 200 + Math.random() * 200;
                    return;
                }
                const actions = [ACTIONS.WALKING, ACTIONS.WORKING, ACTIONS.DRINKING, ACTIONS.READING, ACTIONS.PHONE];
                let weights = [0.4, 0.25, 0.1, 0.15, 0.1];
                if (this.personality === '勤奮') weights = [0.25, 0.55, 0.05, 0.1, 0.05];
                else if (this.personality === '好動') weights = [0.65, 0.15, 0.1, 0.05, 0.05];

                const random = Math.random();
                let sum = 0;
                let selectedAction = actions[0];
                for (let i = 0; i < actions.length; i++) {
                    sum += weights[i];
                    if (random < sum) {
                        selectedAction = actions[i];
                        break;
                    }
                }
                this.action = selectedAction;
                this.actionTimer = 0;
                this.nextActionTime = 100 + Math.random() * 200;
                if (selectedAction === ACTIONS.WALKING) {
                    this.moveToRandomPosition();
                }
            }

            getValidRandomTile(collideOthers = true) {
                let tx = 5, ty = 5;
                for (let attempts = 0; attempts < 2000; attempts++) {
                    tx = Math.floor(Math.random() * COLS);
                    ty = Math.floor(Math.random() * ROWS);
                    if (COLLISION_MAP[ty]?.[tx] === 0 || COLLISION_MAP[ty]?.[tx] === 3) {
                        let occupied = false;
                        if (collideOthers && Array.isArray(window.characters)) {
                            for (const c of window.characters) {
                                if (c !== this) {
                                    if (Math.floor(c.x / GRID_SIZE) === tx && Math.floor(c.y / GRID_SIZE) === ty) occupied = true;
                                    if (c.path && c.path.length > 0) {
                                        const target = c.path[c.path.length - 1];
                                        if (target.x === tx && target.y === ty) occupied = true;
                                    }
                                }
                            }
                        }
                        if (!occupied) return { x: tx, y: ty };
                    }
                }
                return { x: tx, y: ty };
            }

            moveToRandomPosition() {
                if (this.holdStill || this.isHoldingAtHandoff()) return;
                const stayInRoom = this.roomBound || (this.defaultRoom && this.defaultRoom !== '' && this.defaultRoom !== '無');
                if (stayInRoom && window.roomsInfo) {
                    const room = window.roomsInfo.find(r => r.name === this.defaultRoom);
                    if (room && room.tiles && room.tiles.length > 0) {
                        const floorOnly = this.defaultRoom !== REST_ROOM_NAME
                            ? room.tiles.filter(t => COLLISION_MAP[t.y]?.[t.x] === 0)
                            : [];
                        const validTiles = floorOnly.length ? floorOnly : room.tiles.filter(t => {
                            const cell = COLLISION_MAP[t.y]?.[t.x];
                            return cell === undefined || cell === 0 || cell === 3;
                        });
                        const pool = validTiles.length ? validTiles : room.tiles;
                        const target = pool[Math.floor(Math.random() * pool.length)];
                        this.moveTo(target.x * GRID_SIZE + GRID_SIZE / 2, target.y * GRID_SIZE + GRID_SIZE / 2);
                        return;
                    }
                }
                const rt = this.getValidRandomTile(true);
                this.moveTo(rt.x * GRID_SIZE + GRID_SIZE / 2, rt.y * GRID_SIZE + GRID_SIZE / 2);
            }

            findNearestFreeChair(fromX, fromY) {
                let nearestChair = null;
                let minDistance = Infinity;
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (COLLISION_MAP[y]?.[x] === 3) {
                            const occupied = window.characters.some(c =>
                                c.action === ACTIONS.SITTING &&
                                Math.floor(c.x / GRID_SIZE) === x &&
                                Math.floor(c.y / GRID_SIZE) === y
                            );
                            const reserved = window.characters.some(c =>
                                c !== this &&
                                c.path && c.path.length > 0 &&
                                c.path[c.path.length - 1].x === x &&
                                c.path[c.path.length - 1].y === y
                            );
                            if (!occupied && !reserved) {
                                const dist = Math.abs(fromX - x) + Math.abs(fromY - y);
                                if (dist < minDistance) {
                                    minDistance = dist;
                                    nearestChair = { x, y };
                                }
                            }
                        }
                    }
                }
                return nearestChair;
            }

            nearestWalkableInRoom(roomName, preferX, preferY) {
                if (!roomName || !window.roomsInfo) return null;
                const room = window.roomsInfo.find(r => r.name === roomName);
                if (!room || !room.tiles || !room.tiles.length) return null;
                let best = null;
                let bestD = Infinity;
                for (const t of room.tiles) {
                    const cell = COLLISION_MAP[t.y]?.[t.x];
                    if (cell === 1 || cell === undefined) continue;
                    const d = Math.abs(t.x - preferX) + Math.abs(t.y - preferY);
                    if (d < bestD) {
                        bestD = d;
                        best = t;
                    }
                }
                return best;
            }

            moveTo(pixelX, pixelY) {
                this.wakeUp();
                const startTileX = Math.floor(this.x / GRID_SIZE);
                const startTileY = Math.floor(this.y / GRID_SIZE);
                let endTileX = Math.max(0, Math.min(COLS - 1, Math.floor(pixelX / GRID_SIZE)));
                let endTileY = Math.max(0, Math.min(ROWS - 1, Math.floor(pixelY / GRID_SIZE)));

                if (COLLISION_MAP[endTileY]?.[endTileX] === 1) {
                    const alt = this.nearestWalkableInRoom(this.commandTargetRoom || this.defaultRoom, endTileX, endTileY);
                    if (alt) {
                        endTileX = alt.x;
                        endTileY = alt.y;
                    } else {
                        this.action = ACTIONS.IDLE;
                        this.sitting = false;
                        return;
                    }
                }

                let newPath = Pathfinder.findPath(startTileX, startTileY, endTileX, endTileY);
                if ((!newPath || !newPath.length) && (this.commandTargetRoom || this.defaultRoom)) {
                    const alt = this.nearestWalkableInRoom(this.commandTargetRoom || this.defaultRoom, endTileX, endTileY);
                    if (alt && (alt.x !== endTileX || alt.y !== endTileY)) {
                        endTileX = alt.x;
                        endTileY = alt.y;
                        newPath = Pathfinder.findPath(startTileX, startTileY, endTileX, endTileY);
                    }
                }
                if (newPath && newPath.length > 0) {
                    this.path = newPath;
                    this.action = ACTIONS.WALKING;
                    this.sitting = false;
                    this.isWaiting = true;
                    this.targetTileX = endTileX;
                    this.targetTileY = endTileY;
                } else {
                    this.action = ACTIONS.IDLE;
                    this.sitting = false;
                    this.targetTileX = null;
                    this.targetTileY = null;
                }
            }

            draw(spriteManager) {
                spriteManager.drawCharacter(this.x, this.y, this.action, this.frame, this.facing, this);
            }

            /** Floating Zzz animation when character is sleeping in the rest room. */
            drawSleepZzz() {
                if (!this.sleeping) return;
                ctx.save();
                const baseX = Math.round(this.x + 10);
                const baseY = Math.round(this.y - (32 * SCALE) + 10);
                const letters = ['z', 'Z', 'Z'];
                for (let i = 0; i < letters.length; i++) {
                    const phase = ((this.frame * 0.03) + i * 0.33) % 1;
                    const floatY = baseY - phase * 22 - i * 4;
                    const floatX = baseX + Math.sin((this.frame * 0.06) + i) * 3 + i * 5;
                    const alpha = phase < 0.2 ? phase / 0.2 : (1 - phase) / 0.8;
                    const fontSize = 10 + i * 2;
                    ctx.font = `bold ${fontSize}px "Microsoft JhengHei", monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = `rgba(125, 211, 252, ${Math.max(0.15, alpha * 0.95).toFixed(2)})`;
                    ctx.strokeStyle = `rgba(15, 23, 42, ${Math.max(0.2, alpha * 0.9).toFixed(2)})`;
                    ctx.lineWidth = 2.5;
                    const clampedY = Math.max(10, floatY);
                    ctx.strokeText(letters[i], floatX, clampedY);
                    ctx.fillText(letters[i], floatX, clampedY);
                }
                ctx.restore();
            }

            /** Speech bubble: above head when space allows, otherwise below feet (avoids canvas clip). */
            drawSpeechBubble() {
                if (!this.isTalking || !this.bubbleText) return;

                ctx.save();
                const paddingX = 8;
                const paddingY = 5;
                ctx.font = 'bold 12px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';
                const metrics = ctx.measureText(this.bubbleText);
                const width = Math.ceil(metrics.width) + paddingX * 2;
                const height = 16 + paddingY * 2;
                const headTop = this.y - (32 * SCALE);
                const preferAboveAnchor = Math.round(headTop - 8);
                const placeBelow = preferAboveAnchor - height < 4;

                let bx = Math.round(this.x);
                bx = Math.max(Math.ceil(width / 2) + 4, Math.min(LOGICAL_WIDTH - Math.ceil(width / 2) - 4, bx));

                ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.lineWidth = 1.5;

                if (placeBelow) {
                    const by = Math.min(LOGICAL_HEIGHT - height - 4, Math.round(this.y + 12));
                    ctx.translate(bx, by);
                    ctx.beginPath();
                    ctx.roundRect(-width / 2, 0, width, height, 6);
                    ctx.fill();
                    ctx.stroke();
                    // Tail pointing up toward character
                    ctx.beginPath();
                    ctx.moveTo(-5, 1);
                    ctx.lineTo(5, 1);
                    ctx.lineTo(0, -5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.bubbleText, 0, Math.round(height / 2));
                } else {
                    const by = preferAboveAnchor;
                    ctx.translate(bx, by);
                    ctx.beginPath();
                    ctx.roundRect(-width / 2, -height, width, height, 6);
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(-5, -1);
                    ctx.lineTo(5, -1);
                    ctx.lineTo(0, 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.bubbleText, 0, Math.round(-height / 2));
                }
                ctx.restore();
            }
        }

        class Office {
            draw(spriteManager) {
                spriteManager.drawOfficeTile(0, 0, 'background');
                ctx.save();
                for (const key in DOORS_OPEN) {
                    if (DOORS_OPEN[key]) {
                        const [tx, ty] = key.split(',').map(Number);
                        const isEven = ((tx + ty) % 2) === 0;
                        const srcX = isEven ? 4 : 5;
                        const srcY = 23;
                        ctx.drawImage(
                            spriteManager.sprites.background,
                            srcX * GRID_SIZE, srcY * GRID_SIZE, GRID_SIZE, GRID_SIZE,
                            tx * GRID_SIZE, ty * GRID_SIZE, GRID_SIZE, GRID_SIZE
                        );
                    }
                }
                ctx.restore();
            }
        }

        const spriteManager = new SpriteManager();
        const office = new Office();
        let startTime = Date.now();
        let selectedDispatchAgentId = 0;

        window.simulationStarted = true;
        window.characters = [];
        window.roomsInfo = [];

        document.getElementById('toggleRoomOverlay').addEventListener('change', (e) => {
            window.SHOW_ROOM_OVERLAY = e.target.checked;
        });

        async function loadConfig() {
            window.characters = [];
            try {
                try {
                    const collisionResponse = await fetch('/api/collision');
                    const collisionData = await collisionResponse.json();
                    if (Array.isArray(collisionData)) COLLISION_MAP = collisionData;
                } catch (_) {}

                try {
                    const roomsResponse = await fetch('/api/rooms');
                    const roomsData = await roomsResponse.json();
                    if (Array.isArray(roomsData)) {
                        window.roomsInfo = roomsData.map((r, i) => ({
                            id: r.id != null ? r.id : i + 1,
                            name: r.name,
                            isRestRoom: !!r.isRestRoom,
                            handoffSeat: r.handoffSeat || null,
                            handoffWalkaway: r.handoffWalkaway || null,
                            dwellMs: r.dwellMs || null,
                            x: r.tiles && r.tiles.length > 0 ? r.tiles[0].x : (r.x || 0),
                            y: r.tiles && r.tiles.length > 0 ? r.tiles[0].y : (r.y || 0),
                            tiles: r.tiles || []
                        }));
                        window.roomsInfo.forEach(r => {
                            if (r.isRestRoom && r.name) REST_ROOM_NAME = r.name;
                            if (r.handoffSeat) ROOM_HANDOFF_SEATS[r.name] = r.handoffSeat;
                            if (r.handoffWalkaway) ROOM_HANDOFF_WALKAWAY[r.name] = r.handoffWalkaway;
                            if (r.dwellMs) ROOM_DWELL_MS[r.name] = r.dwellMs;
                        });
                    }
                } catch (_) {}

                const response = await fetch('/api/config');
                const config = await response.json();

                if (config.scene) {
                    if (config.scene.title) document.title = config.scene.title;
                    if (config.scene.restRoom) REST_ROOM_NAME = config.scene.restRoom;
                    const subtitleEl = document.getElementById('panelSubtitle');
                    if (subtitleEl && config.scene.panelSubtitle) {
                        subtitleEl.textContent = config.scene.panelSubtitle;
                    }
                }

                if (Array.isArray(config.agents)) {
                    config.agents.forEach((a, idx) => {
                        const id = a.id != null ? a.id : idx;
                        const prevMeta = AGENT_META[id] || {};
                        const homeRoom = a.homeRoom || prevMeta.home || a.room || REST_ROOM_NAME;
                        AGENT_META[id] = {
                            name: a.name || prevMeta.name || `角色 ${id + 1}`,
                            role: a.role || prevMeta.role || '',
                            home: homeRoom,
                            color: a.themeColor || prevMeta.color || DEFAULT_THEME_COLORS[id % DEFAULT_THEME_COLORS.length],
                            badge: a.badge || prevMeta.badge || DEFAULT_BADGES[id % DEFAULT_BADGES.length]
                        };
                        AGENT_HOME_ROOM[id] = homeRoom;
                        if (a.idleLines && (Array.isArray(a.idleLines.post) || Array.isArray(a.idleLines.rest))) {
                            ROLE_IDLE_LINES[id] = {
                                post: Array.isArray(a.idleLines.post) && a.idleLines.post.length ? a.idleLines.post : (ROLE_IDLE_LINES[id]?.post || ['執勤待命中…']),
                                rest: Array.isArray(a.idleLines.rest) && a.idleLines.rest.length ? a.idleLines.rest : (ROLE_IDLE_LINES[id]?.rest || ['休息待命中☕'])
                            };
                        }
                    });
                }

                for (let i = 0; i < 6; i++) {
                    const charConfig = config.agents?.find(a => a.id === i);
                    if (charConfig && charConfig.active === false) continue;

                    const char = new Character(0, 0, i);
                    if (charConfig) {
                        char.name = charConfig.name || AGENT_META[i]?.name || ('角色 ' + (i + 1));
                        char.role = charConfig.role || AGENT_META[i]?.role || '';
                        char.state = charConfig.state || 'idle';
                        char.defaultRoom = charConfig.room || charConfig.defaultRoom || REST_ROOM_NAME;
                        char.personality = charConfig.personality || '勤奮';
                        char.roomBound = true;

                        if (char.defaultRoom === REST_ROOM_NAME) {
                            char.enterRestLounge();
                        } else {
                            char.holdStill = false;
                            char.isWaiting = false;
                            char.state = 'patrol';
                        }

                        const roomInfoObj = window.roomsInfo.find(r => r.name === char.defaultRoom && Array.isArray(r.tiles) && r.tiles.length > 0);
                        const cfgTx = charConfig.x !== undefined ? Math.floor(charConfig.x / GRID_SIZE) : -1;
                        const cfgTy = charConfig.y !== undefined ? Math.floor(charConfig.y / GRID_SIZE) : -1;
                        const cfgWalkable = (COLLISION_MAP[cfgTy]?.[cfgTx] === 0 || COLLISION_MAP[cfgTy]?.[cfgTx] === 3);
                        const cfgInRoom = !roomInfoObj || roomInfoObj.tiles.some(t => t.x === cfgTx && t.y === cfgTy);

                        if (charConfig.x !== undefined && charConfig.y !== undefined && cfgWalkable && cfgInRoom) {
                            char.x = charConfig.x;
                            char.y = charConfig.y;
                        } else if (roomInfoObj) {
                            const validRoomTiles = roomInfoObj.tiles.filter(t => COLLISION_MAP[t.y]?.[t.x] === 0);
                            const pool = validRoomTiles.length ? validRoomTiles : roomInfoObj.tiles;
                            const pick = pool[(i * 5) % pool.length];
                            char.x = pick.x * GRID_SIZE + GRID_SIZE / 2;
                            char.y = pick.y * GRID_SIZE + GRID_SIZE / 2;
                        } else {
                            const rt = char.getValidRandomTile(true);
                            char.x = rt.x * GRID_SIZE + GRID_SIZE / 2;
                            char.y = rt.y * GRID_SIZE + GRID_SIZE / 2;
                        }
                    }
                    char.targetX = char.x;
                    char.targetY = char.y;
                    window.characters.push(char);
                }

                const badge = document.getElementById('selectedAgentBadge');
                const selectedChar = window.characters.find(c => c.id === selectedDispatchAgentId) || window.characters[0];
                if (badge && selectedChar) badge.textContent = `已選：${selectedChar.name}`;

                renderDispatchButtons();
                renderAgentStatusCards();
                renderLogFilterButtons();
            } catch (e) {
                console.error('載入戰情室設定失敗:', e);
            }
            startTime = Date.now();
        }

        function renderDispatchButtons() {
            const charContainer = document.getElementById('quickChars');
            const roomContainer = document.getElementById('quickRooms');
            const badge = document.getElementById('selectedAgentBadge');
            if (!charContainer || !roomContainer) return;

            charContainer.innerHTML = '';
            window.characters.forEach(char => {
                const isSelected = char.id === selectedDispatchAgentId;
                const btn = document.createElement('button');
                btn.className = `px-2 py-1.5 text-xs font-bold rounded border transition-all truncate ${
                    isSelected
                        ? 'bg-sky-600 text-white border-sky-400 shadow shadow-sky-500/30'
                        : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'
                }`;
                btn.textContent = char.name;
                btn.onclick = () => {
                    selectedDispatchAgentId = char.id;
                    if (badge) badge.textContent = `已選：${char.name}`;
                    renderDispatchButtons();
                };
                charContainer.appendChild(btn);
            });

            roomContainer.innerHTML = '';
            window.roomsInfo.forEach(r => {
                const btn = document.createElement('button');
                btn.className = 'px-2 py-1.5 bg-slate-900 hover:bg-indigo-600 text-xs font-medium text-slate-200 hover:text-white rounded border border-slate-700 hover:border-indigo-400 transition-colors truncate';
                btn.textContent = `前往 ${r.name}`;
                btn.onclick = () => dispatchSelectedAgentToRoom(r.name);
                roomContainer.appendChild(btn);
            });
        }

        async function dispatchSelectedAgentToRoom(roomName) {
            const char = window.characters.find(c => c.id === selectedDispatchAgentId);
            const room = window.roomsInfo.find(r => r.name === roomName);
            if (!char || !room || !Array.isArray(room.tiles) || !room.tiles.length) return;

            const walkable = room.tiles.filter(t => COLLISION_MAP[t.y]?.[t.x] === 0);
            const pool = walkable.length ? walkable : room.tiles;
            const pick = pool[Math.floor(Math.random() * pool.length)];

            await fetch(`/api/agent/${char.id}/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'move',
                    room: roomName,
                    tileX: pick.x,
                    tileY: pick.y,
                    sitAfter: false,
                    msg: `手動調度前往${roomName}🚀`
                })
            });
        }

        function renderAgentStatusCards() {
            const container = document.getElementById('agentCards');
            if (!container || !Array.isArray(window.characters)) return;

            container.innerHTML = window.characters.map(c => {
                const meta = AGENT_META[c.id] || { role: c.role, color: '#94a3b8', badge: 'bg-slate-800 text-slate-300 border-slate-600' };
                const roomName = c.defaultRoom || '未分配';
                const isRest = roomName === REST_ROOM_NAME;
                const statusLabel = c.goingToSleep
                    ? '找位置補眠…'
                    : (c.action === ACTIONS.WALKING
                        ? '移動中'
                        : (c.sleeping
                            ? '💤 熟睡中'
                            : (c.sitting ? '入座執勤' : (isRest ? '休息待命' : '房內巡航'))));
                const bubble = c.sleeping ? 'Zzz…' : (c.isTalking && c.bubbleText ? c.bubbleText : '—');

                return `
                    <div class="p-2.5 rounded-lg bg-slate-950/90 border border-slate-800 flex flex-col gap-1">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full" style="background:${meta.color}"></span>
                                <span class="text-xs font-bold text-white">${c.name}</span>
                                <span class="text-[10px] text-slate-400">${meta.role}</span>
                            </div>
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded border ${meta.badge}">${roomName}</span>
                        </div>
                        <div class="flex items-center justify-between text-[11px] text-slate-400 pl-4">
                            <span>狀態：${statusLabel}</span>
                            <span class="text-slate-300 truncate max-w-[180px]">${bubble}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        setInterval(renderAgentStatusCards, 1000);

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const char = window.characters.find(c => c.id === selectedDispatchAgentId) || window.characters[0];
            if (char) char.moveTo(x, y);
        });

        loadConfig();

        let lastRafAt = Date.now();
        setInterval(() => {
            if (!window.simulationStarted || !Array.isArray(window.characters)) return;
            if (Date.now() - lastRafAt > 45) {
                window.characters.forEach(char => char.update());
            }
        }, 16);

        function gameLoop() {
            lastRafAt = Date.now();
            ctx.setTransform(CANVAS_DPR, 0, 0, CANVAS_DPR, 0, 0);
            ctx.imageSmoothingEnabled = false;

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

            window.characters.forEach(char => char.update());
            office.draw(spriteManager);

            // 房間微光底色＋左上角戰情室門牌
            if (window.SHOW_ROOM_OVERLAY && Array.isArray(window.roomsInfo)) {
                ctx.save();
                window.roomsInfo.forEach((r, idx) => {
                    if (!r.tiles || !r.tiles.length) return;
                    ctx.fillStyle = ROOM_COLORS[idx % ROOM_COLORS.length];
                    let minTx = Infinity, minTy = Infinity;
                    for (const t of r.tiles) {
                        ctx.fillRect(t.x * GRID_SIZE, t.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                        if (t.x < minTx) minTx = t.x;
                        if (t.y < minTy) minTy = t.y;
                    }
                    const label = r.name || '';
                    ctx.font = 'bold 13px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    const tw = Math.ceil(ctx.measureText(label).width);
                    const bx = minTx * GRID_SIZE + 4;
                    const by = minTy * GRID_SIZE + 4;
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                    ctx.beginPath();
                    ctx.roundRect(bx, by, tw + 14, 22, 4);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillText(label, bx + 7, by + 11);
                });
                ctx.restore();
            }

            const sortedCharacters = [...window.characters].sort((a, b) => a.y - b.y);
            sortedCharacters.forEach(char => char.draw(spriteManager));

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('timer').textContent = elapsed;

            // 角色名牌：上方空間夠就畫頭頂，否則改畫腳邊（避免蓋臉／被裁切）
            ctx.save();
            ctx.font = 'bold 12px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const nameTagH = 18;
            for (const char of window.characters) {
                if (char.isTalking && char.bubbleText) continue;
                const text = char.name;
                const nameWidth = Math.ceil(ctx.measureText(text).width);
                const tagW = nameWidth + 12;
                let nx = Math.round(char.x);
                nx = Math.max(Math.ceil(tagW / 2) + 2, Math.min(LOGICAL_WIDTH - Math.ceil(tagW / 2) - 2, nx));
                const preferY = Math.round(char.y - (32 * SCALE) - 12);
                const textY = preferY < nameTagH / 2 + 2
                    ? Math.min(LOGICAL_HEIGHT - nameTagH / 2 - 2, Math.round(char.y + 12))
                    : preferY;
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.beginPath();
                ctx.roundRect(nx - tagW / 2, textY - nameTagH / 2, tagW, nameTagH, 4);
                ctx.fill();
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.fillText(text, nx, textY);
            }
            ctx.restore();

            // 氣泡與睡眠 Zzz 最後繪製，避免被房間門牌蓋住
            for (const char of window.characters) {
                char.drawSleepZzz();
                char.drawSpeechBubble();
            }
            requestAnimationFrame(gameLoop);
        }

        async function persistAgentsSnapshot() {
            if (!Array.isArray(window.characters) || !window.characters.length) return;
            try {
                if (!Array.isArray(window.roomsInfo) || !window.roomsInfo.some(r => Array.isArray(r.tiles) && r.tiles.length > 0)) {
                    const rRes = await fetch('/api/rooms');
                    const rData = await rRes.json();
                    if (Array.isArray(rData) && rData.length) {
                        window.roomsInfo = rData.map((r, i) => ({
                            id: r.id != null ? r.id : i + 1,
                            name: r.name,
                            x: r.tiles && r.tiles.length > 0 ? r.tiles[0].x : (r.x || 0),
                            y: r.tiles && r.tiles.length > 0 ? r.tiles[0].y : (r.y || 0),
                            tiles: r.tiles || []
                        }));
                    }
                }
                const response = await fetch('/api/config');
                const config = await response.json();
                window.characters.forEach(char => {
                    const agent = config.agents?.find(a => a.id === char.id);
                    if (!agent) return;
                    agent.x = char.x;
                    agent.y = char.y;
                    agent.room = char.defaultRoom || agent.room || '';
                    agent.state = char.state || agent.state || 'idle';
                    agent.holdStill = !!char.holdStill;
                    agent.sitting = !!char.sitting;
                    agent.action = char.action || 'idle';
                });
                await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agents: config.agents })
                });
            } catch (_) {}
        }
        setInterval(persistAgentsSnapshot, 1500);

        let lastAgentMessages = {};
        async function loadAgentMessages() {
            try {
                const response = await fetch('/api/messages');
                const messages = await response.json();
                window.characters.forEach(char => {
                    const newMsg = messages[char.id];
                    if (newMsg && newMsg.trim() !== '' && newMsg !== lastAgentMessages[char.id]) {
                        lastAgentMessages[char.id] = newMsg;
                        char.isTalking = true;
                        char.bubbleText = newMsg;
                        char.bubbleTimer = 300;
                    }
                });
            } catch (_) {}
        }

        function findRoomAtTile(tx, ty) {
            if (!window.roomsInfo || !window.roomsInfo.length) return null;
            return window.roomsInfo.find(r =>
                r.tiles && r.tiles.some(t => t.x === tx && t.y === ty)
            ) || null;
        }

        function bindAgentToRoom(char, roomName) {
            if (!roomName) return;
            char.wakeUp();
            char.restEnteredAt = roomName === REST_ROOM_NAME ? Date.now() : 0;
            char.defaultRoom = roomName;
            char.commandTargetRoom = roomName;
            char.roomBound = true;
            char.holdStill = false;
        }

        function getActiveVisitorForRoom(roomName, excludeCharId = -1) {
            if (!roomName || roomName === REST_ROOM_NAME || !Array.isArray(window.characters)) return null;
            return window.characters.find(v => {
                if (v.id === excludeCharId) return false;
                if (AGENT_HOME_ROOM[v.id] === roomName) return false;
                const vRoom = v.commandTargetRoom || v.defaultRoom;
                if (vRoom !== roomName) return false;
                const vWalking = !!(v.isWaiting && v.action === ACTIONS.WALKING && v.path && v.path.length > 0);
                const vDwelling = !!(v.commandDwellUntil && Date.now() < v.commandDwellUntil);
                return vWalking || vDwelling;
            }) || null;
        }

        function isHostHoldingForVisitor(hostChar) {
            if (!hostChar || !hostChar.commandSeated || !hostChar.sitting) return false;
            const room = hostChar.commandTargetRoom || hostChar.defaultRoom;
            if (!room || room === REST_ROOM_NAME) return false;
            return !!getActiveVisitorForRoom(room, hostChar.id);
        }

        function sendLocalMoveCommand(char, roomName, tileX, tileY, sitAfter, msg) {
            bindAgentToRoom(char, roomName);
            char.settleOnArrive = true;
            char.sitAfterOnArrive = !!sitAfter;
            if (!sitAfter) {
                char.commandSeated = false;
                char.sitting = false;
            }
            const currentTileX = Math.floor(char.x / GRID_SIZE);
            const currentTileY = Math.floor(char.y / GRID_SIZE);
            if (currentTileX === tileX && currentTileY === tileY) {
                char.applyArriveSettle();
            } else {
                char.moveTo(tileX * GRID_SIZE + GRID_SIZE / 2, tileY * GRID_SIZE + GRID_SIZE / 2);
                char.isWaiting = true;
            }
            if (msg) {
                char.isTalking = true;
                char.bubbleText = msg;
                char.bubbleTimer = 180;
            }
        }

        function syncRoomHandoffChoreography() {
            if (!Array.isArray(window.characters) || !window.characters.length) return;
            for (const host of window.characters) {
                const room = host.defaultRoom;
                if (!room || room === REST_ROOM_NAME) {
                    host.visitorWaitPolls = 0;
                    host.autoSeatedRoom = null;
                    continue;
                }
                if (AGENT_HOME_ROOM[host.id] !== room) continue;
                const visitor = getActiveVisitorForRoom(room, host.id);
                if (visitor) {
                    const busyMoving = host.isWaiting && host.action === ACTIONS.WALKING && host.path && host.path.length > 0;
                    if (!host.commandSeated && !busyMoving) {
                        host.visitorWaitPolls = (host.visitorWaitPolls || 0) + 1;
                        if (host.visitorWaitPolls >= 2) {
                            const seat = ROOM_HANDOFF_SEATS[room];
                            if (seat) {
                                host.autoSeatedRoom = room;
                                sendLocalMoveCommand(host, room, seat.x, seat.y, true, '收到！入座對接業務📋');
                            }
                        }
                    } else {
                        host.visitorWaitPolls = 0;
                    }
                } else {
                    host.visitorWaitPolls = 0;
                    if (host.autoSeatedRoom === room && host.commandSeated) {
                        host.autoSeatedRoom = null;
                        const away = ROOM_HANDOFF_WALKAWAY[room];
                        if (away) {
                            sendLocalMoveCommand(host, room, away.x, away.y, false, '交辦完畢，各自忙去🙌');
                        }
                    }
                }
            }
        }

        async function loadAgentCommands() {
            try {
                for (const char of window.characters) {
                    if (
                        (char.isWaiting && char.action === ACTIONS.WALKING && char.path && char.path.length > 0) ||
                        (char.commandDwellUntil && Date.now() < char.commandDwellUntil) ||
                        isHostHoldingForVisitor(char)
                    ) {
                        continue;
                    }
                    const response = await fetch(`/api/agent/${char.id}/command`);
                    const cmd = await response.json();

                    if (cmd && cmd.action) {
                        if (cmd.action === 'move' && cmd.tileX !== undefined && cmd.tileY !== undefined) {
                            const pixelX = cmd.tileX * GRID_SIZE + GRID_SIZE / 2;
                            const pixelY = cmd.tileY * GRID_SIZE + GRID_SIZE / 2;
                            const roomFromCmd = cmd.room ? (window.roomsInfo || []).find(r => r.name === cmd.room) : null;
                            const roomAtTile = roomFromCmd || findRoomAtTile(cmd.tileX, cmd.tileY);
                            if (roomAtTile) bindAgentToRoom(char, roomAtTile.name);
                            else if (cmd.room) bindAgentToRoom(char, cmd.room);

                            char.settleOnArrive = true;
                            char.sitAfterOnArrive = !!cmd.sitAfter;
                            char.autoSeatedRoom = null;
                            char.visitorWaitPolls = 0;
                            if (!cmd.sitAfter) {
                                char.commandSeated = false;
                                char.sitting = false;
                            }

                            const currentTileX = Math.floor(char.x / GRID_SIZE);
                            const currentTileY = Math.floor(char.y / GRID_SIZE);
                            if (currentTileX === cmd.tileX && currentTileY === cmd.tileY) {
                                fetch(`/api/agent/${char.id}/command/ack`, { method: 'POST' });
                                char.applyArriveSettle();
                                fetch(`/api/agent/${char.id}/arrived`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ location: cmd.sitAfter ? 'office' : 'reception' })
                                });
                            } else {
                                char.commandSeated = false;
                                char.sitting = false;
                                char.moveTo(pixelX, pixelY);
                                char.isWaiting = true;
                            }

                            if (cmd.msg) {
                                char.isTalking = true;
                                char.bubbleText = cmd.msg;
                                char.bubbleTimer = 180;
                            }
                        } else if (cmd.action === 'sit') {
                            char.isWaiting = true;
                            const tx = Math.floor(char.x / GRID_SIZE);
                            const ty = Math.floor(char.y / GRID_SIZE);
                            if (tx === cmd.tileX && ty === cmd.tileY) {
                                char.action = ACTIONS.SITTING;
                                char.sitting = true;
                                char.commandSeated = true;
                                char.faceNearestDesk();
                                fetch(`/api/agent/${char.id}/command/ack`, { method: 'POST' });
                            }
                        } else if (cmd.action === 'idle') {
                            char.isWaiting = false;
                            char.commandSeated = false;
                            fetch(`/api/agent/${char.id}/command/ack`, { method: 'POST' });
                        }
                    }
                }
                syncRoomHandoffChoreography();
            } catch (e) {
                console.error('讀取代理指令失敗:', e);
            }
        }

        setInterval(() => {
            loadAgentMessages();
            loadAgentCommands();
        }, 1000);
        loadAgentMessages();
        loadAgentCommands();

        // === 活動紀錄與 6 角色篩選 ===
        const tabMonitor = document.getElementById('tabMonitor');
        const tabLog = document.getElementById('tabLog');
        const viewMonitor = document.getElementById('viewMonitor');
        const viewLog = document.getElementById('viewLog');
        const logEntries = document.getElementById('logEntries');

        let logFilters = { 0: true, 1: true, 2: true, 3: true, 4: true, 5: true };
        let tradeOnlyLog = true;
        let allLogs = [];

        const toggleTradeOnlyEl = document.getElementById('toggleTradeOnlyLog');
        const logCountBadgeEl = document.getElementById('logCountBadge');
        if (toggleTradeOnlyEl) {
            toggleTradeOnlyEl.addEventListener('change', (e) => {
                tradeOnlyLog = !!e.target.checked;
                renderLogs();
            });
        }

        function isTradeLogEntry(log) {
            const text = `${log.msg || ''} ${log.action || ''}`;
            return /\b(BUY|SELL)\b/i.test(text) || /(買進|賣出|買單|賣單|做多|做空)/.test(text);
        }

        function renderLogFilterButtons() {
            const container = document.getElementById('logFilterContainer');
            if (!container) return;
            container.innerHTML = '';
            Object.entries(AGENT_META).forEach(([idStr, meta]) => {
                const id = Number(idStr);
                const active = !!logFilters[id];
                const btn = document.createElement('button');
                btn.className = `flex items-center gap-1.5 px-2 py-1 rounded border text-left transition-all ${
                    active ? 'bg-slate-800 border-slate-600 opacity-100' : 'bg-slate-950 border-slate-800 opacity-40'
                }`;
                btn.innerHTML = `
                    <span class="w-2 h-2 rounded-full shrink-0" style="background:${meta.color}"></span>
                    <span class="truncate text-slate-200">${meta.name}</span>
                `;
                btn.onclick = () => {
                    logFilters[id] = !logFilters[id];
                    renderLogFilterButtons();
                    renderLogs();
                };
                container.appendChild(btn);
            });
        }

        function renderLogs() {
            logEntries.innerHTML = '';
            const filteredLogs = allLogs.filter(log => {
                if (!(logFilters[log.agent] ?? true)) return false;
                if (tradeOnlyLog && !isTradeLogEntry(log)) return false;
                return true;
            });
            if (logCountBadgeEl) {
                logCountBadgeEl.textContent = tradeOnlyLog
                    ? `${filteredLogs.length} / ${allLogs.length} 筆`
                    : `${filteredLogs.length} 筆`;
            }
            if (filteredLogs.length === 0) {
                const emptyHint = tradeOnlyLog && allLogs.length > 0
                    ? `目前尚無 BUY / SELL 買賣紀錄（共略過 ${allLogs.length} 筆一般移動紀錄）`
                    : '目前尚無活動紀錄';
                logEntries.innerHTML = `<div class="text-slate-500 text-center py-6">${emptyHint}</div>`;
                return;
            }
            filteredLogs.forEach(log => {
                if (!log.time || log.agent === undefined) return;
                const meta = AGENT_META[log.agent] || { name: `角色 ${log.agent}`, color: '#64748b' };
                const entry = document.createElement('div');
                entry.className = 'flex items-start gap-2 p-2 bg-slate-900/80 border-l-2 rounded';
                entry.style.borderLeftColor = meta.color;
                entry.innerHTML = `
                    <span class="text-slate-500 text-[10px] whitespace-nowrap">${log.time}</span>
                    <span class="font-bold whitespace-nowrap" style="color:${meta.color}">[${meta.name}]</span>
                    <span class="text-slate-200">${log.msg || log.action || ''}</span>
                `;
                logEntries.appendChild(entry);
            });
            const container = document.getElementById('logContainer');
            if (container) container.scrollTop = container.scrollHeight;
        }

        tabMonitor.addEventListener('click', () => {
            tabMonitor.classList.add('text-sky-400', 'border-b-2', 'border-sky-400');
            tabMonitor.classList.remove('text-slate-400');
            tabLog.classList.remove('text-sky-400', 'border-b-2', 'border-sky-400');
            tabLog.classList.add('text-slate-400');
            viewMonitor.classList.remove('hidden');
            viewLog.classList.add('hidden');
        });

        tabLog.addEventListener('click', () => {
            tabLog.classList.add('text-sky-400', 'border-b-2', 'border-sky-400');
            tabLog.classList.remove('text-slate-400');
            tabMonitor.classList.remove('text-sky-400', 'border-b-2', 'border-sky-400');
            tabMonitor.classList.add('text-slate-400');
            viewMonitor.classList.add('hidden');
            viewLog.classList.remove('hidden');
            viewLog.style.display = 'flex';
            refreshLog();
        });

        async function refreshLog() {
            try {
                const response = await fetch('/api/log');
                allLogs = await response.json();
                renderLogs();
            } catch (e) {
                logEntries.innerHTML = '<div class="text-rose-400 text-center py-4">載入紀錄失敗</div>';
            }
        }

        async function clearLog() {
            try {
                await fetch('/api/log/clear', { method: 'POST' });
                allLogs = [];
                renderLogs();
            } catch (_) {}
        }

        setInterval(() => {
            if (!viewLog.classList.contains('hidden')) refreshLog();
        }, 2000);

        renderLogFilterButtons();
        gameLoop();
    </script>
</body>
</html>
